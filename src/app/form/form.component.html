<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" required />
    <div *ngIf="userForm.get('id').hasError('required') && userForm.get('id').touched">
      ID is required.
    </div>
    <div *ngIf="userForm.get('id').hasError('pattern') && userForm.get('id').touched">
      ID must be a positive number.
    </div>
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" required />
    <div *ngIf="userForm.get('name').hasError('required') && userForm.get('name').touched">
      Name is required.
    </div>
    <div *ngIf="userForm.get('name').hasError('pattern') && userForm.get('name').touched">
      Name cannot contain special characters like #, !, ?.
    </div>
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" required />
    <div *ngIf="userForm.get('email').hasError('required') && userForm.get('email').touched">
      Email is required.
    </div>
    <div *ngIf="userForm.get('email').hasError('email') && userForm.get('email').touched">
      Enter a valid email address.
    </div>
  </div>

  <div class="form-group">
    <label for="contact">Contact</label>
    <input type="text" id="contact" formControlName="contact" required />
    <div *ngIf="userForm.get('contact').hasError('required') && userForm.get('contact').touched">
      Contact is required.
    </div>
  </div>

  <div class="form-group">
    <label for="isAdmin">Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin" />
  </div>

  <button type="submit" [disabled]="userForm.invalid">Add</button>
  <button type="button" (click)="onUpdate()" [disabled]="userForm.invalid">Update</button>
  <button type="button" (click)="resetForm()">Reset</button>
</form>
