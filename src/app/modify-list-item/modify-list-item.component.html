<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name" />
  </div>

  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" formControlName="email" />
  </div>

  <div class="form-group">
    <label for="contacts">Contacts</label>
    <input type="text" id="contacts" formControlName="contacts" />
  </div>

  <div class="form-group">
    <label for="isAdmin">Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin" />
  </div>

  <button type="submit">Submit</button>
  <button type="button" (click)="navigateToUserList()">Back to List</button>
</form>
