<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="example-form">
  <!-- ID Input Field -->
  <mat-form-field class="example-full-width">
    <mat-label>ID</mat-label>
    <input
      matInput
      type="number"
      id="id"
      formControlName="id"
      matTooltip="Enter a unique ID"
      matTooltipPosition="right"
      appHighlightOnFocus
      [appHoverHighlight]="'red'"
    />
  </mat-form-field>
  <br />

  <!-- Name Input Field -->
  <mat-form-field class="example-full-width">
    <mat-label>Name</mat-label>
    <input
      matInput
      type="text"
      id="name"
      formControlName="name"
      matTooltip="Enter the user's full name"
      matTooltipPosition="right"
      [appHoverHighlight]="'red'"
    />
  </mat-form-field>
  <br />

  <!-- Email Input Field -->
  <mat-form-field class="example-full-width">
    <mat-label>Email</mat-label>
    <input
      matInput
      type="email"
      id="email"
      formControlName="email"
      matTooltip="Provide a valid email address"
      matTooltipPosition="right"
      [appHoverHighlight]="'red'"
    />
  </mat-form-field>
  <br />

  <!-- Contacts Input Field -->
  <mat-form-field class="example-full-width">
    <mat-label>Contacts</mat-label>
    <input
      matInput
      type="text"
      id="contacts"
      formControlName="contacts"
      matTooltip="Provide the user's contact details"
      matTooltipPosition="left"
      [appHoverHighlight]="'red'"
    />
  </mat-form-field>
  <br />

  <!-- Admin Checkbox -->
  <mat-checkbox formControlName="isAdmin" matTooltip="Check if the user is an admin" matTooltipPosition="right">
    Admin
  </mat-checkbox>

  <!-- Buttons -->
  <div class="form-buttons">
    <button mat-raised-button color="primary" type="submit">Submit</button>
    <button mat-raised-button color="warn" type="button" (click)="navigateToUserList()">Back to List</button>
  </div>
</form>
