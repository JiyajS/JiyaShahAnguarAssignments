<!-- modify-user.component.html -->
<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <!-- ID Field -->
  <div class="form-group">
    <label for="id">ID</label>
    <input type="number" id="id" formControlName="id" />
  </div>

  <!-- First Name Field -->
  <div class="form-group">
    <label for="firstName">Name</label>
    <input type="text" id="firstName" formControlName="firstName" />
  </div>

  <!-- Last Name Field -->
  <div class="form-group">
    <label for="lastName">Email</label>
    <input type="text" id="lastName" formControlName="lastName" />
  </div>

  <!-- Department Field -->
  <div class="form-group">
    <label for="department">Contact</label>
    <input type="text" id="department" formControlName="department" />
  </div>

  <!-- Is Admin Checkbox -->
  <div class="form-group">
    <label for="isAdmin">Admin</label>
    <input type="checkbox" id="isAdmin" formControlName="isAdmin" />
  </div>

  <!-- Submit Button (Add or Update) -->
  <button type="submit">Submit</button>
  <!-- Back Button -->
  <button type="button" (click)="navigateToUserList()">Back to List</button>
</form>
