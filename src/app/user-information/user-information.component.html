<div *ngFor="let person of login" class="person-container" [appHoverHighlight]="'teal'">
  <mat-card class="example-card" appearance="outlined">
<!--    <mat-card-header>-->
<!--      <div mat-card-avatar class="example-header-image"></div>-->
<!--      <mat-card-title>{{ person.name | uppercase }}</mat-card-title>-->
<!--      <mat-card-subtitle>{{ person.email }}</mat-card-subtitle>-->
<!--    </mat-card-header>-->

    <mat-card-content>
      <div class="person-field"><strong>ID:</strong> {{ person.id }}</div>
      <div class="person-field"><strong>Name :</strong> {{ person.name | uppercase}}</div>
      <div class="person-field"><strong>Email:</strong> {{ person.email }}</div>
      <div class="person-field"><strong>{{ person | pipeBank }}</strong></div>
      <div><p [style.color]="person | bonusPipe"><strong>Admin: {{person.Admin}}</strong></p></div>
    </mat-card-content>

    <mat-card-actions>
      <!-- Navigate to edit user page -->
      <button mat-raised-button (click)="onEdit(person.id)">Edit</button>
      <!-- Delete user -->
      <button mat-raised-button (click)="onDelete(person.id)">Delete</button>
    </mat-card-actions>
  </mat-card>
</div>
